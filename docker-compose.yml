services:
  # Layer 1: Presentation Layer (React Client)
  rag-ui-client:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ai-rag-studio/web-client:latest
    container_name: rag-ui-client
    ports:
      - "3000:80"
    depends_on:
      - rag-api-core
    networks:
      - rag-net

  # Layer 2: Business Logic / Orchestrator Layer (Express API)
  rag-api-core:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ai-rag-studio/core-api:latest
    container_name: rag-api-core
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://amimind:amimind123@postgres:5432/amimind
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-net

  # Layer 3: PostgreSQL (replaces Qdrant)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: amimind
      POSTGRES_PASSWORD: amimind123
      POSTGRES_DB: amimind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amimind -d amimind"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-net

volumes:
  postgres-data:
  api-db-volume:

networks:
  rag-net:
    driver: bridge
