version: '3.8'

services:
  # Layer 1: Presentation Layer (React Client)
  rag-ui-client:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ai-rag-studio/web-client:latest
    container_name: rag-ui-client
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - rag-api-core
    networks:
      - rag-net

  # Layer 2: Business Logic / Orchestrator Layer (Express & Gemini Orchestrator)
  rag-api-core:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ai-rag-studio/core-api:latest
    container_name: rag-api-core
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - VECTOR_DB_HOST=vector-db-node
      - VECTOR_DB_PORT=6333
    volumes:
      - api-db-volume:/app/db_stores
    depends_on:
      - vector-db-node
    networks:
      - rag-net

  # Layer 3: Vector Storage Layer (High-Performance Vector DB: Qdrant)
  vector-db-node:
    image: qdrant/qdrant:latest
    container_name: vector-db-node
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vector-db-volume:/qdrant/storage
    networks:
      - rag-net

volumes:
  api-db-volume:
  vector-db-volume:

networks:
  rag-net:
    driver: bridge
